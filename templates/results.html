{% extends "base.html" %} {% block content %}

<h3>Screening Results</h3>

<table border="1" cellpadding="8">
  <tr>
    <th>Candidate</th>
    <th>Status</th>
    <th>Action</th>
  </tr>

  {% for candidate in results %}
  <tr>
    <td>{{ candidate.name }}</td>
    <td>{{ candidate.status }}</td>
    <td>
      <a href="/candidate/{{ candidate.id }}">View</a>
    </td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
